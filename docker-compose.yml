services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oslo
      POSTGRES_USER: oslo
      POSTGRES_PASSWORD: oslo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oslo -d oslo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ap-south-1
      ACTIVATE_PRO: "0"
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/create-queues.sh:/etc/localstack/init/ready.d/01-create-queues.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate"]
    command:
      - -path=/migrations
      - -database=postgres://oslo:oslo@postgres:5432/oslo?sslmode=disable
      - up

  # api runtime. compose overrides the image default command with api
  api:
    image: oslo:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://oslo:oslo@postgres:5432/oslo?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: oslo-local-jwt-signing-secret-key
      JWT_LIFETIME: 24h
      HTTP_RATE_LIMIT_REQUESTS: ${HTTP_RATE_LIMIT_REQUESTS:-60}
      HTTP_RATE_LIMIT_WINDOW: ${HTTP_RATE_LIMIT_WINDOW:-1m}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: oslo:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://oslo:oslo@postgres:5432/oslo?sslmode=disable
      REDIS_URL: redis://redis:6379
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/oslo-matching
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

  publisher:
    image: oslo:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["publisher"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://oslo:oslo@postgres:5432/oslo?sslmode=disable
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/oslo-matching
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

volumes:
  postgres_data:
  redis_data:
  localstack_data:
