services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oslo
      POSTGRES_USER: oslo
      POSTGRES_PASSWORD: oslo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oslo -d oslo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: